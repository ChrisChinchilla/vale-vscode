on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: npm ci
        run: npm ci
      - name: Compile
        run: npm run compile
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      # The smoke test activates the extension, which loads the bundled
      # dist/extension.js ("main"), so the bundle must exist first.
      - name: Webpack (production bundle)
        run: npm run webpack
      - name: Extension host smoke test
        run: xvfb-run -a npm run test:integration
      - name: Package extension
        run: npm run package

  windows-docker-proxy:
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        working-directory: native/vale-docker-proxy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: native/vale-docker-proxy/go.mod
      - name: Test proxy
        run: go test ./...
      - name: Build x64 proxy
        env:
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -buildvcs=false -ldflags "-s -w -buildid=" -o proxy-x64.exe .
      - name: Build ARM64 proxy
        env:
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: go build -trimpath -buildvcs=false -ldflags "-s -w -buildid=" -o proxy-arm64.exe .
      - name: Check committed binaries against this build
        id: check
        shell: pwsh
        run: |
          $stale = $false
          foreach ($pair in @(
            @{ Built = "proxy-x64.exe"; Committed = "bin/vale-docker-proxy-windows-x64.exe" },
            @{ Built = "proxy-arm64.exe"; Committed = "bin/vale-docker-proxy-windows-arm64.exe" }
          )) {
            $built = (Get-FileHash $pair.Built -Algorithm SHA256).Hash
            $committed = (Get-FileHash $pair.Committed -Algorithm SHA256).Hash
            if ($built -ne $committed) {
              # Go only guarantees byte-identical output for the same
              # toolchain version building the same source with the same
              # flags - not across compiler versions. go.mod's `go 1.22`
              # is a floor, not a pin, so `setup-go`'s resolved version (and
              # any local committer's version) can legitimately drift from
              # whatever produced the currently-committed binary, with no
              # actual source change involved. Rebuilding here and
              # publishing the result is the source of truth, not a human
              # re-running the exact same fragile manual step.
              Write-Host "$($pair.Committed) is stale (built $built, committed $committed) - refreshing it"
              Copy-Item $pair.Built $pair.Committed -Force
              $stale = $true
            }
          }
          echo "stale=$stale" >> $env:GITHUB_OUTPUT
      - name: Open PR with refreshed binaries
        # Only a branch has something to open a fix PR against - a tag push
        # (this job also runs as part of publishTags.yml/publishPreRelease.yml's
        # `validate` via workflow_call) can't be amended after the fact, and
        # a fork PR's GITHUB_TOKEN has no write access to push to the fork's
        # branch at all, even a side branch. Both fall through to the plain
        # failure below instead. A PR (not a direct push) is required because
        # main is a protected branch - the bot token can't push straight to
        # it, only open a PR for a human to merge.
        if: steps.check.outputs.stale == 'True' && github.ref_type == 'branch' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ci/refresh-windows-proxy-binaries
          base: ${{ github.head_ref || github.ref_name }}
          add-paths: |
            native/vale-docker-proxy/bin/vale-docker-proxy-windows-x64.exe
            native/vale-docker-proxy/bin/vale-docker-proxy-windows-arm64.exe
          commit-message: "chore: rebuild Windows Docker proxy binaries"
          title: "chore: rebuild Windows Docker proxy binaries"
          body: >
            Auto-generated by the `windows-docker-proxy` CI job: the
            committed binaries didn't byte-match a fresh build with the
            pinned Go toolchain (`native/vale-docker-proxy/go.mod`), most
            likely from a Go patch-version bump rather than a source change.
            Merge to pick up the refreshed binaries.
      - name: Fail if binaries were stale
        if: steps.check.outputs.stale == 'True'
        run: |
          if ('${{ github.ref_type }}' -eq 'branch' -and ('${{ github.event_name }}' -ne 'pull_request' -or '${{ github.event.pull_request.head.repo.full_name }}' -eq '${{ github.repository }}')) {
            echo "::error::Committed Windows Docker proxy binaries didn't match a fresh build. A fix PR was just opened against this branch - merge it, then re-run this job (or push again) to pick it up."
          } else {
            echo "::error::Committed Windows Docker proxy binaries didn't match a fresh build, and this run can't open a fix PR (tagged release or fork PR). Rebuild from native/vale-docker-proxy per README.md, commit the result, and push/retag."
          }
          exit 1
