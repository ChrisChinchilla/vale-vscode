on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: npm ci
        run: npm ci
      - name: Compile
        run: npm run compile
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Webpack (production bundle)
        run: npm run webpack
      - name: Package extension
        run: npm run package

  windows-docker-proxy:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: native/vale-docker-proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/vale-docker-proxy/go.mod
      - name: Test proxy
        run: go test ./...
      - name: Build x64 proxy
        env:
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w -buildid=" -o proxy-x64.exe .
      - name: Build ARM64 proxy
        env:
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w -buildid=" -o proxy-arm64.exe .
      - name: Verify committed binaries match this build
        shell: pwsh
        run: |
          $mismatch = $false
          foreach ($pair in @(
            @{ Built = "proxy-x64.exe"; Committed = "bin/vale-docker-proxy-windows-x64.exe" },
            @{ Built = "proxy-arm64.exe"; Committed = "bin/vale-docker-proxy-windows-arm64.exe" }
          )) {
            $built = (Get-FileHash $pair.Built -Algorithm SHA256).Hash
            $committed = (Get-FileHash $pair.Committed -Algorithm SHA256).Hash
            if ($built -ne $committed) {
              Write-Error "$($pair.Committed) does not match a fresh build from this source (built $built, committed $committed). Rebuild it from native/vale-docker-proxy per README.md and commit the result."
              $mismatch = $true
            }
          }
          if ($mismatch) {
            exit 1
          }
          Write-Host "Committed proxy binaries match a fresh build from source."
