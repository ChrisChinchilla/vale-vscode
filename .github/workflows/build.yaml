on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: npm ci
        run: npm ci
      - name: Compile
        run: npm run compile
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Extension host smoke test
        run: xvfb-run -a npm run test:integration
      - name: Webpack (production bundle)
        run: npm run webpack
      - name: Package extension
        run: npm run package

  windows-docker-proxy:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: native/vale-docker-proxy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/vale-docker-proxy/go.mod
      - name: Test proxy
        run: go test ./...
      - name: Build x64 proxy
        env:
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w -buildid=" -o proxy-x64.exe .
      - name: Build ARM64 proxy
        env:
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w -buildid=" -o proxy-arm64.exe .
      - name: Check committed binaries against this build
        id: check
        shell: pwsh
        run: |
          $stale = $false
          foreach ($pair in @(
            @{ Built = "proxy-x64.exe"; Committed = "bin/vale-docker-proxy-windows-x64.exe" },
            @{ Built = "proxy-arm64.exe"; Committed = "bin/vale-docker-proxy-windows-arm64.exe" }
          )) {
            $built = (Get-FileHash $pair.Built -Algorithm SHA256).Hash
            $committed = (Get-FileHash $pair.Committed -Algorithm SHA256).Hash
            if ($built -ne $committed) {
              # Go only guarantees byte-identical output for the same
              # toolchain version building the same source with the same
              # flags - not across compiler versions. go.mod's `go 1.22`
              # is a floor, not a pin, so `setup-go`'s resolved version (and
              # any local committer's version) can legitimately drift from
              # whatever produced the currently-committed binary, with no
              # actual source change involved. Rebuilding here and
              # publishing the result is the source of truth, not a human
              # re-running the exact same fragile manual step.
              Write-Host "$($pair.Committed) is stale (built $built, committed $committed) - refreshing it"
              Copy-Item $pair.Built $pair.Committed -Force
              $stale = $true
            }
          }
          echo "stale=$stale" >> $env:GITHUB_OUTPUT
      - name: Commit refreshed binaries
        # Only a branch has something to push a fix commit to - a tag push
        # (this job also runs as part of publishTags.yml/publishPreRelease.yml's
        # `validate` via workflow_call) can't be amended after the fact, and
        # a fork PR's GITHUB_TOKEN has no write access to the fork's branch.
        # Both fall through to the plain failure below instead.
        if: steps.check.outputs.stale == 'True' && github.ref_type == 'branch' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/vale-docker-proxy-windows-x64.exe bin/vale-docker-proxy-windows-arm64.exe
          git commit -m "chore: rebuild Windows Docker proxy binaries"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
      - name: Fail if binaries were stale
        if: steps.check.outputs.stale == 'True'
        run: |
          if ('${{ github.ref_type }}' -eq 'branch' -and ('${{ github.event_name }}' -ne 'pull_request' -or '${{ github.event.pull_request.head.repo.full_name }}' -eq '${{ github.repository }}')) {
            echo "::error::Committed Windows Docker proxy binaries didn't match a fresh build. A fix commit was just pushed to this branch - re-run this job (or push again) to pick it up."
          } else {
            echo "::error::Committed Windows Docker proxy binaries didn't match a fresh build, and this run can't push a fix back (tagged release or fork PR). Rebuild from native/vale-docker-proxy per README.md, commit the result, and push/retag."
          }
          exit 1
