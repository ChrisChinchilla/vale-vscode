name: Claude issue implementation

# Second half of the issue workflow: after a maintainer reviews the plan
# posted by claude-issue-plan.yml, mentioning @claude in a comment on the
# issue triggers this workflow, which has write access and is allowed to
# push a branch and open a draft PR for further review.

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  implement:
    if: >
      !github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Implement the reviewed plan
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --permission-mode acceptEdits
          prompt: |
            A maintainer has reviewed and approved a plan on this issue and
            is now asking you to implement it (see the latest comment for
            any adjustments to the plan).

            Implement the change, then push it to a new branch and open it
            as a DRAFT pull request. Never push directly to main. Follow the
            repository's `.claude/CLAUDE.md` working agreement (tests,
            README updates, PROJECT_AUDIT.md checkbox) for any user-facing
            change.
