on:
  push:
    tags:
      - "v*"

name: Publish Extension on tag
jobs:
  parity:
    uses: ./.github/workflows/versionParity.yml

  validate:
    needs: parity
    if: needs.parity.outputs.is_prerelease == 'false'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/build.yaml

  deploy:
    needs: [parity, validate]
    if: needs.parity.outputs.is_prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - name: Publish to Open VSX Registry
        uses: HaaLeo/publish-vscode-extension@f4ece70f329f66686bd71c54b1671353fe320e49 # v1
        with:
          pat: ${{ secrets.OPEN_VSX_TOKEN }}
      - name: Publish to Visual Studio Marketplace
        uses: HaaLeo/publish-vscode-extension@f4ece70f329f66686bd71c54b1671353fe320e49 # v1
        with:
          pat: ${{ secrets.VS_MARKETPLACE_TOKEN }}
          registryUrl: https://marketplace.visualstudio.com
